name: Bug report
description: Report a reproducible game/runtime issue
title: "[Bug] "
body:
  - type: textarea
    id: summary
    attributes:
      label: Problem and expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Windows version, build SHA, GPU and controller
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or non-proprietary evidence
